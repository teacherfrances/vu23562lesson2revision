<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Places to go revision</title>
<style>
:root{
  --g:#1E5B45; --gd:#143F30; --gm:#4F7F6A; --gw:#E7EFEA; --gt:#F3F7F4;
  --o:#D4A12A; --ot:#7A5A12; --ow:#FAF3E1; --ink:#26302C; --grey:#6B6F68; --line:#D8D0C0;
  --hd:"Trebuchet MS","Segoe UI",Carlito,"Helvetica Neue",Arial,sans-serif;
  --bd:Georgia,"DejaVu Serif","Times New Roman",serif;
  --barH:3.1rem;
}
*{box-sizing:border-box}
html{font-size:28px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gt);color:var(--ink);font-family:var(--bd);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.hd{font-family:var(--hd);font-weight:700}
.sr{position:absolute;left:-9999px}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--gd);color:#fff;display:flex;align-items:center;gap:.3rem;padding:.3rem .45rem;min-height:var(--barH);font-family:var(--hd);font-weight:700;font-size:clamp(19px,.8rem,34px)}
#top button{background:transparent;border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:.45rem;min-height:2.3rem;min-width:2.3rem;padding:.15rem .55rem;font-weight:700}
#top button:hover{background:rgba(255,255,255,.12)}
#ttl{flex:1;min-width:0;color:#F3DFA6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3rem}
#cnt{background:#fff;color:var(--gd);border-radius:2rem;padding:.1rem .6rem;white-space:nowrap}
#saved{color:#F3DFA6;opacity:0;transition:opacity .3s;white-space:nowrap}
#saved.on{opacity:1}
.szlab{white-space:nowrap}

/* bottom bar */
#bot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:2px solid var(--line);display:flex;align-items:center;gap:.4rem;padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));font-family:var(--hd);font-weight:700;font-size:clamp(19px,.8rem,34px)}
#tip{flex:1;min-width:0;color:var(--grey);font-family:var(--bd);font-weight:400}
#bot button{min-height:2.4rem;border-radius:.5rem;padding:.15rem .8rem;border:2px solid var(--g);background:#fff;color:var(--g);font-weight:700}
#bot button.go{background:var(--g);color:#fff}
#bot button.wait{background:var(--ow);border-color:var(--o);color:var(--ot)}
#skip{border-color:var(--grey)!important;color:var(--grey)!important;font-size:.85em}

main{max-width:980px;margin:0 auto;padding:calc(var(--barH) + 1rem) .6rem 6.5rem}

/* jump pill */
#jump{position:fixed;left:50%;transform:translateX(-50%);bottom:4.4rem;z-index:19;background:var(--o);color:#fff;border:0;border-radius:2rem;padding:.3rem 1rem;font-family:var(--hd);font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none;max-width:92vw}

/* menu */
.strip{display:flex;align-items:stretch;border-radius:.4rem;overflow:hidden;margin-bottom:.35rem;font-family:var(--hd);font-weight:700;font-size:.72rem}
.strip .tag{background:var(--o);color:#fff;padding:.25rem .6rem}
.strip .bar{background:var(--gd);color:#fff;padding:.25rem .6rem;flex:1}
.band{background:var(--g);color:#fff;border-radius:.4rem;padding:.7rem .9rem;margin-bottom:.8rem}
.band h1{margin:0;font-size:1.45rem;line-height:1.15}
.band p{margin:.2rem 0 0;color:#DCE9E1}
.stopbar{display:flex;align-items:stretch;border-radius:.35rem;overflow:hidden;margin:1.1rem 0 .55rem;font-family:var(--hd);font-weight:700}
.stopbar .st{background:var(--gd);color:#fff;padding:.3rem .65rem;white-space:nowrap}
.stopbar .tt{background:var(--g);color:#fff;padding:.3rem .65rem;flex:1}
.mcard{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-left:.35rem solid var(--g);border-radius:.5rem;padding:.6rem .7rem;margin:0 0 .5rem}
.mcard:hover{border-color:var(--gm)}
.mcard .mt{flex:1}
.mcard .mt b{display:block;font-family:var(--hd);color:var(--g);font-size:1.05rem}
.mcard .mt span{display:block;color:var(--grey)}
.pill{display:inline-block;margin-top:.25rem;border-radius:2rem;padding:.05rem .6rem;font-family:var(--hd);font-weight:700;background:var(--ow);color:var(--ot);border:2px solid var(--o)}
.pill.done{background:var(--gw);color:var(--g);border-color:var(--g)}

/* number square */
.nsq{display:inline-flex;align-items:center;gap:.25rem;background:var(--g);color:#fff;border-radius:.3rem;padding:.15rem .45rem;font-family:var(--hd);font-weight:700;min-width:2rem;min-height:2rem;justify-content:center;flex-shrink:0}
.nsq svg{width:.95em;height:.95em;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* boxes */
.panel{background:#fff;border:2px solid var(--line);border-radius:.5rem;padding:.6rem .8rem;margin:.6rem 0}
.tipb{background:var(--gw);border-left:.35rem solid var(--g);border-radius:.4rem;padding:.55rem .8rem;margin:.7rem 0}
.tipb .bt{font-family:var(--hd);font-weight:700;color:var(--g);margin-bottom:.15rem}
.warn{background:var(--ow);border-left:.35rem solid var(--o);border-radius:.4rem;padding:.55rem .8rem;margin:.7rem 0}
.warn .bt{font-family:var(--hd);font-weight:700;color:var(--ot);margin-bottom:.15rem;display:flex;align-items:center;gap:.4rem}
.bang{display:inline-flex;align-items:center;justify-content:center;background:var(--o);color:#fff;font-family:var(--hd);font-weight:700;width:1.25em;height:1.25em;border-radius:.15rem}
.warn p,.tipb p{margin:.25rem 0}
.lead{color:var(--grey);font-style:italic;margin:.4rem 0}

/* part head */
.phead{display:flex;gap:.6rem;align-items:flex-start;margin:.2rem 0 .5rem}
.instr{flex:1;background:#fff;border-left:.3rem solid var(--g);border-radius:.35rem;padding:.4rem .7rem;border:2px solid var(--line);border-left-width:.3rem;border-left-color:var(--g)}
.instr h2{margin:0 0 .15rem;font-size:1.1rem;color:var(--g)}
.instr p{margin:.1rem 0}
.prog{height:.45rem;background:var(--gw);border-radius:1rem;overflow:hidden;margin:.4rem 0 .2rem}
.prog i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.live{color:var(--grey);font-family:var(--hd);font-weight:700;font-size:.85rem}
.sub{font-family:var(--hd);font-weight:700;color:var(--g);font-size:1.02rem;margin:1.1rem 0 .3rem}

/* cards */
.card{background:#fff;border:2px solid var(--line);border-left:.4rem solid var(--line);border-radius:.55rem;padding:.6rem .75rem;margin:.65rem 0;scroll-margin-top:calc(var(--barH) + 1rem)}
.card.ok{border-left-color:var(--g)}
.card.bad{border-left-color:var(--o)}
.card.flash{animation:fl 1s ease 2}
@keyframes fl{50%{box-shadow:0 0 0 .3rem var(--o)}}
.chead{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.7rem;border-radius:.3rem;background:var(--g);color:#fff;font-family:var(--hd);font-weight:700}
.ctag{font-family:var(--hd);font-weight:700;color:var(--ot)}
.q{margin:.15rem 0 .45rem}
.q b,.say{font-family:var(--hd)}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;background:#fff;border:2px solid var(--gm);border-radius:.6rem;padding:.4rem .7rem;min-height:2.3rem;font-size:1rem}
.opt:hover:not([disabled]){background:var(--gt)}
.opt.sel{background:var(--gw);border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.opt.right{background:var(--gw);border-color:var(--g);color:var(--gd)}
.opt.right::before{content:"\2713  ";font-weight:700;color:var(--g)}
.opt.wrong{background:var(--ow);border-color:var(--o);color:var(--ot)}
.opt.wrong::before{content:"\2717  ";font-weight:700}
.opt[disabled]{cursor:default}
.chip{border-radius:2rem;text-align:center;padding:.3rem .8rem}
.syls{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.syls .opt{min-width:2.6rem;text-align:center;font-family:var(--hd);font-weight:700}
.dot{color:var(--grey);font-weight:700}
.btn{border:2px solid var(--g);background:var(--g);color:#fff;border-radius:.55rem;padding:.3rem .9rem;min-height:2.3rem;font-family:var(--hd);font-weight:700;margin:.4rem .3rem 0 0}
.btn.ghost{background:#fff;color:var(--g)}
.btn.ochre{background:var(--ow);color:var(--ot);border-color:var(--o)}
.btn[disabled]{opacity:.45;cursor:default}
.fb{margin-top:.5rem;border-radius:.45rem;padding:.45rem .7rem}
.fb.good{background:var(--gw)}
.fb.badf{background:var(--ow)}
.fb b{font-family:var(--hd);display:block}
.fb.good b{color:var(--g)}
.fb.badf b{color:var(--ot)}
.change{background:none;border:0;color:var(--g);text-decoration:underline;font-family:var(--hd);font-weight:700;padding:.3rem 0;min-height:2rem}
.gap{display:inline-block;min-width:4em;border-bottom:3px dashed var(--gm);color:var(--g);font-family:var(--hd);font-weight:700}

.playb{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--g);background:var(--gw);color:var(--g);border-radius:2rem;padding:.15rem .8rem;min-height:2.2rem;font-family:var(--hd);font-weight:700;margin:.15rem 0 .35rem}

/* player */
.player{background:#fff;border:2px solid var(--gm);border-radius:.6rem;padding:.55rem .7rem;margin:.6rem 0}
.player .row{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.player .rate{color:var(--grey);font-family:var(--hd);font-weight:700}
.locked{color:var(--grey);font-style:italic;margin:.35rem 0 0}

/* dialogue */
.dlg{width:100%;border-collapse:collapse;margin:.4rem 0;background:#fff}
.dlg td{border:1px solid var(--line);padding:.35rem .55rem;vertical-align:top}
.dlg td.who{background:var(--gw);font-family:var(--hd);font-weight:700;color:var(--g);width:1%;white-space:nowrap}
.dlg tr.now td{background:var(--ow)}
.dlg .lp{border:0;background:none;color:var(--g);font-size:.9em;min-width:1.8rem;min-height:1.8rem;padding:0;float:right}
.ex{font-family:var(--hd);font-weight:700;color:var(--g)}

/* chat */
.chat{display:flex;flex-direction:column;gap:.3rem;margin:.3rem 0 .5rem}
.bub{max-width:88%;padding:.35rem .65rem;border-radius:.9rem;background:var(--gt);border:1px solid var(--line)}
.bub small{display:block;font-family:var(--hd);font-weight:700;color:var(--gm);font-size:.72rem}
.bub.r{align-self:flex-end;background:var(--gw);border-color:#c9dccf}

/* plan */
.pgrp{margin:.5rem 0}
.pgrp .pl{font-family:var(--hd);font-weight:700;color:var(--g);margin-bottom:.25rem}
.convo td.who{min-width:4.5em}

.summary{background:#fff;border:2px solid var(--g);border-radius:.6rem;padding:.7rem .9rem;margin:1rem 0}
.summary h3{margin:0 0 .3rem;color:var(--g)}
.miss{display:inline-block;margin:.2rem .3rem 0 0;border:2px solid var(--o);background:var(--ow);color:var(--ot);border-radius:2rem;padding:.1rem .7rem;font-family:var(--hd);font-weight:700}

.welcome{background:var(--ow);border:2px solid var(--o);border-radius:.6rem;padding:.6rem .8rem;margin:.4rem 0 .8rem}
.welcome b{font-family:var(--hd);color:var(--ot)}
.big{font-family:var(--hd);font-weight:700;font-size:2.6rem;color:var(--g);text-align:center;margin:.3rem 0}
.stars{text-align:center;font-size:1.8rem;color:var(--o);letter-spacing:.2rem}
.rrow{display:flex;justify-content:space-between;gap:.5rem;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:.5rem;padding:.45rem .7rem;margin:.35rem 0}
.rrow b{font-family:var(--hd);color:var(--g)}
textarea.cl{width:100%;min-height:8rem;font:inherit;border:2px solid var(--gm);border-radius:.5rem;padding:.4rem}
.small{font-size:.85rem;color:var(--grey)}

@media (max-width:700px){
  main{padding-left:.4rem;padding-right:.4rem}
  #ttl{display:none}
  .fslab,.szlab{display:none}
  #top{justify-content:space-between;gap:.2rem;padding:.25rem .3rem}
  #top button{padding:.1rem .4rem;min-width:2rem}
  #cnt{display:none}
  #jump{font-size:19px;padding:.25rem .8rem;white-space:nowrap;bottom:4.2rem}
  #tip{display:none}
  #bot{justify-content:space-between}
  .band h1{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

   {b:'sub',h:'Part b: up &#8599; or down &#8600;?'},
   {b:'items',items:[
    {k:'a3_i1',t:'mcq',say:'Really?',q:'<span class="say">Really?</span>',opts:['&#8599; Up','&#8600; Down'],why:'Really? goes up. It is a question. You want to hear more.'},
    {k:'a3_i2',t:'mcq',say:'Is that right?',q:'<span class="say">Is that right?</span>',opts:['&#8599; Up','&#8600; Down'],why:'Is that right? goes up. It works like Really? You are surprised.'},
    {k:'a3_i3',t:'mcq',say:'No way!',q:'<span class="say">No way!</span>',opts:['&#8600; Down','&#8599; Up'],why:'No way! goes down. It is a strong reaction, not a real question.'},
    {k:'a3_i4',t:'mcq',say:'Sounds fun.',q:'<span class="say">Sounds fun.</span>',opts:['&#8600; Down','&#8599; Up'],why:'Sounds fun. goes down. It is a statement.'},
    {k:'a3_i5',t:'mcq',say:'Oh, lovely!',q:'<span class="say">Oh, lovely!</span>',opts:['&#8600; Down','&#8599; Up'],why:'Oh, lovely! goes down. It shows you are happy for the person.'},
    {k:'a3_i6',t:'mcq',say:'Great idea.',q:'<span class="say">Great idea.</span>',opts:['&#8600; Down','&#8599; Up'],why:'Great idea. goes down. You agree with the plan.'}
   ]},
   {b:'sub',h:'Part c: react, then ask'},
   {b:'items',items:[
    {k:'a3_c1',t:'mcq',q:'Your partner says: <b>"I went to a cooking class on Monday."</b>',
     opts:['Oh, lovely! What did you cook?','Oh, lovely! What do you cook?','What did you cook?','Oh, lovely! I went too.'],
     why:'React, then ask. Monday is in the past, so ask with did: What did you cook?'},
    {k:'a3_c2',t:'mcq',q:'Your partner says: <b>"The library was closed this morning."</b>',
     opts:['Oh no. Was it a public holiday?','Great idea. Was it a public holiday?','Oh no. Did it a public holiday?','Was it a public holiday?'],
     why:'This is bad news, so react with Oh no. Then a past question with was.'},
    {k:'a3_c3',t:'mcq',q:'Your partner says: <b>"I\'m going to join a choir."</b>',
     opts:['Really? When does it start?','Really? When did it start?','Oh no. When does it start?','When does it start?'],
     why:'This is a plan for the future. The choir has a start time now, so use does: When does it start?'},
    {k:'a3_c4',t:'mcq',q:'Your partner says: <b>"My neighbour swims at 6 am every day."</b>',
     opts:['No way! Is the water cold?','No way! Does the water cold?','Is the water cold?','No way! See you later.'],
     why:'No way! shows surprise. Cold is an adjective, so use is: Is the water cold?'},
    {k:'a3_c5',t:'mcq',q:'Your partner says: <b>"The community garden gives away free vegetables."</b>',
     opts:['Is that right? Where is it?','Is that right? Where it is?','Where is it?','Oh no. Where is it?'],
     why:'Is that right? shows surprise. In a question, is comes before it: Where is it?'}
   ]},
   {b:'done',h:'<div class="tipb"><div class="bt">Now practise with a partner</div><p>Say your own news to your partner. Your partner reacts with voice and face, then asks a question. Swap.</p></div>'}
  ]},

var STOPS={1:'Talk first: a morning at the community centre',2:'Everyday expressions: going out and trying things',3:'Say it: service words and opening hours'};

/* ============ helpers ============ */
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function exMark(t){return esc(t).replace(/\{([^}]+)\}/g,'<span class="ex">$1</span>')}
function plain(t){return String(t).replace(/\{([^}]+)\}/g,'$1').replace(/<[^>]+>/g,'').replace(/&#8599;|&#8600;/g,'')}
function iconHTML(list){var h='';for(var i=0;i<list.length;i++)h+=IC[list[i]];return h}

var ITEMS={},PARTOF={};
for(var pi=0;pi<PARTS.length;pi++){
  var P=PARTS[pi];P.items=[];
  for(var bi=0;bi<P.blocks.length;bi++){
    var B=P.blocks[bi];
    if(B.b==='items'){for(var ii=0;ii<B.items.length;ii++){var it=B.items[ii];ITEMS[it.k]=it;PARTOF[it.k]=pi;P.items.push(it)}}
  }
}
function marks(it){return it.t==='tick'?it.n:1}
function partTotal(P){var t=0;for(var i=0;i<P.items.length;i++)t+=marks(P.items[i]);return t}
var TOTAL=0;for(var q=0;q<PARTS.length;q++)TOTAL+=partTotal(PARTS[q]);

/* ============ state + storage ============ */
var KEY='vu23562_l2_places_a1to9_v1';
var st={view:'menu',ans:{},ord:{},seq:{},plan:{},found:{},last:null};
var ui={size:1,blocked:0,cls:[]};
var SIZES=[24,28,34,42],SIZEN=['Normal','Large','Larger','Largest'];
var canStore=(function(){try{var k='__t'+Date.now();localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}})();
function load(){
  if(!canStore)return;
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.ans){st.ans=s.ans;st.ord=s.ord||{};st.seq=s.seq||{};st.plan=s.plan||{};st.found=s.found||{};st.last=s.last||null}}catch(e){}
  try{var z=parseInt(localStorage.getItem(KEY+'_size'),10);if(z>=0&&z<SIZES.length)ui.size=z}catch(e){}
  try{var c=JSON.parse(localStorage.getItem(KEY+'_class')||'[]');if(c&&c.length)ui.cls=c}catch(e){}
}
var dirty=false,savedT=null;
function save(show){
  if(!canStore)return;
  try{localStorage.setItem(KEY,JSON.stringify({ans:st.ans,ord:st.ord,seq:st.seq,plan:st.plan,found:st.found,last:st.last}));dirty=false;
    if(show){var s=$('saved');s.className='on';clearTimeout(savedT);savedT=setTimeout(function(){s.className=''},1300)}}catch(e){}
}
function touch(){dirty=true;save(true)}
setInterval(function(){if(dirty)save(false)},1500);
window.addEventListener('pagehide',function(){save(false)});
document.addEventListener('visibilitychange',function(){if(document.hidden)save(false)});

function ordFor(it){
  if(it.t==='syl')return range(it.syl.length);
  if(!st.ord[it.k]||st.ord[it.k].length!==it.opts.length){st.ord[it.k]=shuffle(range(it.opts.length));dirty=true}
  return st.ord[it.k];
}
function seqFor(P,B,bi){
  var key=P.id+'_'+bi;
  if(B.keep)return range(B.items.length);
  if(!st.seq[key]||st.seq[key].length!==B.items.length){st.seq[key]=shuffle(range(B.items.length));dirty=true}
  return st.seq[key];
}
function isRight(it,orig){
  if(it.t==='syl')return orig===it.a;
  if(it.t==='tick')return it.right.indexOf(orig)>=0;
  return orig===0;
}
function partStats(P){
  var got=0,done=0,tm=0;
  for(var i=0;i<P.items.length;i++){var it=P.items[i],a=st.ans[it.k];tm+=marks(it);if(a){done++;got+=a.m}}
  return {got:got,done:done,n:P.items.length,tm:tm,complete:done===P.items.length,started:done>0};
}
function firstLeft(P){for(var i=0;i<P.items.length;i++)if(!st.ans[P.items[i].k])return P.items[i].k;return null}

/* ============ speech ============ */
var TTS={ok:('speechSynthesis' in window),v:[],rate:0.85,token:0,line:-1,which:null};
function pickVoices(){
  if(!TTS.ok)return;
  var all=speechSynthesis.getVoices()||[];
  var prefs=['en-AU','en_AU','en-GB','en_GB','en-NZ','en-US','en_US','en'];
  var out=[];
  for(var p=0;p<prefs.length;p++){for(var i=0;i<all.length;i++){var l=(all[i].lang||'');if(l.indexOf(prefs[p])===0&&out.indexOf(all[i])<0)out.push(all[i])}}
  var fem=[];for(var j=0;j<out.length;j++){if(/female|karen|catherine|natasha|serena|kate|samantha|zira|libby|sonia|hazel|susan/i.test(out[j].name))fem.push(out[j])}
  TTS.v=fem.length>=2?fem:(fem.length?fem.concat(out.filter(function(x){return fem.indexOf(x)<0})):out);
}
if(TTS.ok){pickVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=pickVoices}
function voiceFor(who){
  var second=!!SECOND[who];
  return {v:TTS.v[second&&TTS.v.length>1?1:0]||null,pitch:second&&TTS.v.length<2?1.25:1};
}
function sayOne(text,who,onend,rate){
  var u=new SpeechSynthesisUtterance(plain(text));var vv=voiceFor(who||'K');
  if(vv.v){u.voice=vv.v;u.lang=vv.v.lang}else u.lang='en-AU';
  u.pitch=vv.pitch;u.rate=rate||TTS.rate;u.onend=onend||null;u.onerror=onend||null;
  speechSynthesis.speak(u);
}
function stopTalk(){if(!TTS.ok)return;TTS.token++;speechSynthesis.cancel();TTS.line=-1;markLine()}
function playLines(lines,which,from){
  if(!TTS.ok)return;
  stopTalk();var tok=TTS.token;TTS.which=which;var i=from||0;
  function next(){
    if(tok!==TTS.token)return;

function go(v){st.view=v;ui.blocked=0;render()}
function next(){
  if(st.view==='menu'){var f=0;for(var i=0;i<PARTS.length;i++){if(!partStats(PARTS[i]).complete){f=i;break}}go(String(f));return}
  if(st.view==='results'||st.view==='class'){go('menu');return}
  var p=+st.view,P=PARTS[p],k=firstLeft(P);
  if(k){ui.blocked++;gotoCard(k);barForPart(p);return}
  if(p<PARTS.length-1)go(String(p+1));else go('results');
}

var resetArm=false;
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  var act=t.getAttribute('data-act'),k=t.getAttribute('data-k'),it=k?ITEMS[k]:null,pi=it?PARTOF[k]:null;
  switch(act){
  case 'menu':go('menu');break;
  case 'next':next();break;
  case 'back':back();break;
  case 'skip':var p=+st.view;if(p<PARTS.length-1)go(String(p+1));else go('results');break;
  case 'open':go(String(t.getAttribute('data-p')));break;
  case 'results':go('results');break;
  case 'classview':go('class');break;
  case 'jump':var P=PARTS[+st.view];var fk=firstLeft(P);if(fk)gotoCard(fk);break;
  case 'szdown':if(ui.size>0){ui.size--;applySize();try{localStorage.setItem(KEY+'_size',ui.size)}catch(x){}}break;
  case 'szup':if(ui.size<SIZES.length-1){ui.size++;applySize();try{localStorage.setItem(KEY+'_size',ui.size)}catch(x){}}break;
  case 'fs':
    var d=document,el=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    break;
  case 'pick':
    if(st.ans[k])return;
    var pos=+t.getAttribute('data-p'),orig=it.t==='syl'?pos:ordFor(it)[pos];
    st.ans[k]={pick:orig,m:isRight(it,orig)?1:0};touch();refreshPart(pi,k);break;
  case 'tick':
    if(st.ans[k])return;
    var po=+t.getAttribute('data-p'),og=ordFor(it)[po],cur=TMP[k]||[];
    var at=cur.indexOf(og);
    if(at>=0)cur.splice(at,1);else if(cur.length<it.n)cur.push(og);
    TMP[k]=cur;refreshPart(pi,k);break;
  case 'check':
    var pk=TMP[k]||[];if(pk.length!==it.n)return;
    var m=0;for(var q=0;q<pk.length;q++)if(isRight(it,pk[q]))m++;
    st.ans[k]={pick:pk.slice(),m:m};delete TMP[k];touch();refreshPart(pi,k);break;
  case 'change':delete st.ans[k];delete TMP[k];touch();refreshPart(pi,k);break;
  case 'goto':gotoCard(k);break;
  case 'again':
    var PP=PARTS[+t.getAttribute('data-p')];
    for(var a=0;a<PP.items.length;a++){delete st.ans[PP.items[a].k];delete st.ord[PP.items[a].k];delete TMP[PP.items[a].k];if(st.found)delete st.found[PP.items[a].k]}
    for(var sk in st.seq)if(st.seq.hasOwnProperty(sk)&&sk.indexOf(PP.id+'_')===0)delete st.seq[sk];
    PP._wasComplete=false;touch();render();break;
  case 'reset':
    if(!resetArm){resetArm=true;t.textContent='Tap again to delete all answers';setTimeout(function(){resetArm=false;var rb=$('resetBtn');if(rb)rb.textContent='Start the whole lesson again'},4000);return}
    resetArm=false;st.ans={};st.ord={};st.seq={};st.plan={};st.found={};st.last=null;TMP={};
    for(var z=0;z<PARTS.length;z++)PARTS[z]._wasComplete=false;
    touch();render();break;
  case 'found':
    var ni=+t.getAttribute('data-n'),nm=ni<0?'yes':ui.cls[ni];
    if(st.found[k]===nm)delete st.found[k];else st.found[k]=nm;touch();refreshPart(pi,k);break;
  case 'plan':
    var key=t.getAttribute('data-key'),v=t.getAttribute('data-v');
    if(key==='place'&&st.plan.place!==v)delete st.plan.did;
    st.plan[key]=v;touch();
    $('planbox').innerHTML=planHTML();$('myconv').innerHTML=myConvHTML();break;
  case 'togconv':var cb=$('convbox');var show=cb.style.display==='none';cb.style.display=show?'':'none';t.textContent=show?'Hide the conversation':'Show the conversation';break;
  case 'playconv':playLines(CONV,'c',0);break;
  case 'playchat':playLines(chatLines(true),'h',0);break;
  case 'line':
    var w=t.getAttribute('data-w'),li=+t.getAttribute('data-i');
    var L=w==='c'?CONV:(w==='h'?chatLines(true):MYCONV);
    stopTalk();TTS.which=w;TTS.line=li;markLine();var tok=TTS.token;
    sayOne(L[li][1],L[li][0],function(){if(tok===TTS.token){TTS.line=-1;markLine()}});break;
  case 'stop':stopTalk();break;
  case 'slower':TTS.rate=Math.max(0.55,Math.round((TTS.rate-0.1)*100)/100);if($('rate'))$('rate').textContent='Speed '+Math.round(TTS.rate*100)+'%';break;
  case 'faster':TTS.rate=Math.min(1.15,Math.round((TTS.rate+0.1)*100)/100);if($('rate'))$('rate').textContent='Speed '+Math.round(TTS.rate*100)+'%';break;
  case 'say':
    stopTalk();
    if(it.t==='syl'){var wd=it.word;sayOne(wd,'K',function(){setTimeout(function(){sayOne(wd,'K',null,0.7)},500)},0.7)}
    else sayOne(it.say,'K',null,0.8);
    break;
  case 'saymodel':stopTalk();sayOne(it.opts[0],'K',null,0.85);break;
  case 'clsave':
    var raw=$('cltext').value.split(/\n|,/),list=[];
    for(var r=0;r<raw.length;r++){var nmx=raw[r].replace(/^\s+|\s+$/g,'');if(nmx&&list.indexOf(nmx)<0)list.push(nmx)}
    ui.cls=list;try{localStorage.setItem(KEY+'_class',JSON.stringify(list))}catch(x){}
    $('clmsg').textContent=list.length+' names saved.';$('cnt').textContent=list.length+' names';break;
  case 'clclear':ui.cls=[];try{localStorage.removeItem(KEY+'_class')}catch(x){}$('cltext').value='';$('clmsg').textContent='The list is clear.';$('cnt').textContent='0 names';break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')back();else if(e.key==='Escape')go('menu');
});

/* ============ start ============ */
load();applySize();
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))$('bFs').style.display='none';
for(var w0=0;w0<PARTS.length;w0++)PARTS[w0]._wasComplete=partStats(PARTS[w0]).complete;
render();
</script>
</body>
</html>
